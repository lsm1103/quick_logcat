# 推送一个 v* 版本 tag 后，自动跑测试并发布到 npm。
#
# 鉴权用的是 npm Trusted Publishing（OIDC）：由 GitHub 直接向 npm 证明
# “这次发布确实来自本仓库的这个 workflow”，因此不需要任何 token，
# 也不受账号 2FA 设置影响。
#
# 前提（只需配置一次）：在 npmjs.com 的包页面 → Settings → Trusted Publisher
# 添加一个 GitHub Actions publisher，填：
#   Organization or user : lsm1103
#   Repository           : quick_logcat
#   Workflow filename    : npm-publish.yml
#   Environment          : 留空
#
# 以后发版就两步：
#   npm version patch       # 自动改版本号、生成 commit 并打 v* tag
#   git push --follow-tags  # 推送 commit 和 tag，tag 一到就触发自动发布
name: Publish to npm

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write # Trusted Publishing (OIDC) 必需

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
      # Trusted Publishing 需要 npm >= 11.5.1，setup-node 自带的可能偏旧
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm test
      - run: npm publish --access public --provenance
